[build]
  functions = "netlify/functions"
  publish = "."

[build.environment]
  # Build-time Node version.
  NODE_VERSION = "22"
  # Functions RUNTIME (AWS Lambda) Node version. Separate lever from NODE_VERSION:
  # Netlify's functions runtime does not reliably follow the build version, and
  # @supabase/supabase-js needs an unflagged global WebSocket at createClient()
  # (Node >= 22.4). The tiktok-* functions also hand Supabase an explicit `ws`
  # transport, so they work even if this is ignored.
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

# Daily Supabase retention job (~00:20 America/New_York). Same job runs on Vercel
# via vercel.json "crons". See netlify/functions/cleanup.js.
[functions."cleanup"]
  schedule = "20 5 * * *"

# Campaign Creator auto-duplication safety net — runs process_duplication even
# when the dashboard tab is closed (the 60s in-browser poll is still the primary
# trigger while it's open; this just means an ad group that goes Active
# overnight still gets its 20 copies). Idempotent, no-op when nothing is
# WAITING_FOR_ACTIVE/DUPLICATING. Production is Vercel now — see vercel.json
# "crons" for the real one (GET /api/campaign-creator; Vercel Hobby crons are
# capped to once/day, Pro runs the real */5 schedule). This Netlify schedule
# is kept only in case a Netlify deploy of this repo is ever used again — it
# arrives as a bodyless POST, handled the same as the Vercel GET.
[functions."campaign-creator"]
  schedule = "*/5 * * * *"
