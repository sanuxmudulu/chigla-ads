[build]
  functions = "netlify/functions"
  publish = "."

[build.environment]
  # Build-time Node version.
  NODE_VERSION = "22"
  # Functions RUNTIME (AWS Lambda) Node version. Separate lever from NODE_VERSION:
  # Netlify's functions runtime does not reliably follow the build version, and
  # @supabase/supabase-js needs an unflagged global WebSocket at createClient()
  # (Node >= 22.4). The tiktok-* functions also hand Supabase an explicit `ws`
  # transport, so they work even if this is ignored.
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

# Daily Supabase retention job (~00:20 America/New_York). Same job runs on Vercel
# via vercel.json "crons". See netlify/functions/cleanup.js.
[functions."cleanup"]
  schedule = "20 5 * * *"

# NOTE: Campaign Creator duplication has NO scheduler (2026-09-05, by design —
# duplication is manual, triggered only by the dashboard's "Dupe" button). A
# */5 cron here previously mirrored one in vercel.json, but Vercel's Hobby
# plan REJECTS THE ENTIRE DEPLOYMENT for any cron finer than once/day — that
# silently blocked every deploy from the moment it was added until it was
# removed. Don't re-add a sub-daily cron for this function without confirming
# the Vercel plan supports it. Progress on an in-progress manual dupe (and
# auto-appeal) continues via the existing ~60s in-browser poll while the
# dashboard is open — see js/app.js runCampaignCreatorDuplication().
