<!DOCTYPE html>
<html lang="en" data-theme="kuzan">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chigla Organic — Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/base.css" />
<style>
  .organic-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 18px; }
  .organic-nav button {
    padding: 8px 14px; border-radius: 10px; border: 1px solid var(--panel-border, rgba(255,255,255,0.1));
    background: transparent; color: inherit; font: inherit; cursor: pointer; opacity: 0.7;
  }
  .organic-nav button.active { opacity: 1; background: var(--accent, #6c5ce7); border-color: transparent; color: #fff; }
  .organic-view { display: none; }
  .organic-view.active { display: block; }
  .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
  .pill-ok { background: rgba(46, 204, 113, 0.15); color: #2ecc71; }
  .pill-warn { background: rgba(241, 196, 15, 0.15); color: #f1c40f; }
  .form-row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; }
  .form-field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; flex: 1 1 180px; }
  .form-field input, .form-field select {
    padding: 10px 12px; border-radius: 8px; border: 1px solid var(--panel-border, rgba(255,255,255,0.12));
    background: rgba(255,255,255,0.04); color: inherit; font: inherit;
  }
  .checks { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; font-size: 14px; text-transform: capitalize; }
  .btn { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--panel-border, rgba(255,255,255,0.12)); background: transparent; color: inherit; font: inherit; cursor: pointer; }
  .btn-primary { background: var(--accent, #6c5ce7); border-color: transparent; color: #fff; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  pre.out { max-height: 320px; overflow: auto; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 14px; font-size: 12px; }
</style>
</head>
<body>

<div class="ambient ambient-kuzan">
  <video class="ambient-kuzan-video" autoplay loop muted playsinline preload="auto">
    <source src="assets/themes/kuzan-bg.mp4" type="video/mp4" />
  </video>
</div>

<header class="topbar">
  <div class="topbar-left">
    <a class="icon-btn" href="/" title="Switch to the ads dashboard" style="text-decoration:none;display:inline-flex;align-items:center;">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px;"><path d="M17 1l4 4-4 4"></path><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><path d="M7 23l-4-4 4-4"></path><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>Ads
    </a>
    <div class="brand">CHIGLA ORGANIC</div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn icon-only" id="signOutBtn" title="Sign out">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </button>
  </div>
</header>

<main class="app-shell">
  <nav class="organic-nav">
    <button data-view="overview" class="active">Overview</button>
    <button data-view="content">Content</button>
    <button data-view="schedule">Schedule</button>
    <button data-view="test">Test post</button>
  </nav>

  <!-- ============ OVERVIEW ============ -->
  <section class="organic-view active" id="view-overview">
    <section class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-body">
          <div class="kpi-label">Drive videos</div>
          <div class="kpi-value tabular" id="kpiVideos">—</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-body">
          <div class="kpi-label">Daily plan</div>
          <div class="kpi-value tabular" id="kpiPosts">—</div>
        </div>
      </div>
    </section>
    <section class="table-section card">
      <div class="table-header"><h3>Build progress</h3></div>
      <div id="progressList" style="padding: 14px 18px; font-size: 14px; line-height: 2;"></div>
    </section>
  </section>

  <!-- ============ CONTENT ============ -->
  <section class="organic-view" id="view-content">
    <section class="table-section card">
      <div class="table-header"><h3>Content — Drive / Content / ClipN</h3></div>
      <div class="table-wrap"><table id="contentTable"></table></div>
    </section>
  </section>

  <!-- ============ SCHEDULE ============ -->
  <section class="organic-view" id="view-schedule">
    <section class="table-section card">
      <div class="table-header"><h3>Today's plan</h3></div>
      <div class="table-wrap"><table id="scheduleTable"></table></div>
    </section>
  </section>

  <!-- ============ TEST POST ============ -->
  <section class="organic-view" id="view-test">
    <section class="table-section card">
      <div class="table-header"><h3>Test post</h3></div>
      <div style="padding: 16px 18px;">
        <div class="form-row">
          <div class="form-field" style="flex-basis: 100%;">
            <label>Video</label>
            <select id="tpVideo"></select>
          </div>
        </div>
        <div class="checks" id="tpPlatforms"></div>
        <div class="form-row">
          <div class="form-field" style="flex-basis: 100%;">
            <label>Caption (also the YouTube title)</label>
            <input id="tpTitle" value="Test post #test" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>TikTok privacy</label>
            <select id="tpTiktokPrivacy">
              <option>SELF_ONLY</option>
              <option>PUBLIC_TO_EVERYONE</option>
              <option>MUTUAL_FOLLOW_FRIENDS</option>
              <option>FOLLOWER_OF_CREATOR</option>
            </select>
          </div>
          <div class="form-field">
            <label>YouTube privacy</label>
            <select id="tpYoutubePrivacy">
              <option>private</option>
              <option>unlisted</option>
              <option>public</option>
            </select>
          </div>
          <div class="form-field">
            <label>Facebook Page ID</label>
            <input id="tpPageId" placeholder="needed for Facebook" />
          </div>
        </div>
        <div style="display:flex; gap:10px; flex-wrap: wrap;">
          <button class="btn" id="tpDryRun">Dry run</button>
          <button class="btn btn-primary" id="tpSend">Post for real</button>
          <button class="btn" id="tpStatus" style="display:none;">Check status</button>
        </div>
        <pre class="out" id="tpOut" style="display:none; margin-top: 14px;"></pre>
      </div>
    </section>
  </section>
</main>

<script type="module" src="js/organic.js"></script>
</body>
</html>
